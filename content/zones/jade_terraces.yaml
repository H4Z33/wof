# Heightmap built by `go -C server run ./cmd/terraingen -zone jade_terraces`,
# which writes it here and to client/assets/terrain. Re-run it after changing
# any generation value below (and commit both files).
terrain:
  file: jade_terraces.terrain
  # Walking rules, shared by server and client.
  max_slope_deg: 40
  water_level: -1.0
  wade_depth: 0.6
  # Generation.
  seed: 20261019
  spacing: 0.5
  margin: 8
  hill_height: 7
  hill_scale: 38
  terrace_step: 1.4
  terrace_strength: 0.8
  border_height: 26
  lakes:
    - center: [-14, 34]
      radius: 13
      depth: -3.5

# Village decor around the spawn plaza (drawn by the client; you can walk
# through them for now).
props:
  - { kind: house, at: [-12, 5], yaw: 70 }
  - { kind: house, at: [-8, -11], yaw: 20 }
  - { kind: house, at: [9, -12], yaw: -25 }
  - { kind: house, at: [13, 4], yaw: -80 }
  - { kind: house, at: [6, 12], yaw: 190 }
  - { kind: lantern, at: [4, 3] }
  - { kind: lantern, at: [-4, 4] }
  - { kind: lantern, at: [-3, -5] }
  - { kind: lantern, at: [5, -4] }
