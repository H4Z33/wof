# Fate works like a tabletop game master.
#
# Ahead of time, in the background, the Fate agent (an LLM) prepares a small
# deck of possible fates for each player: situations and narrations that fit
# their place, deeds and standing. The server decides which slots the deck
# must cover (trigger, omen, magnitude) by sampling the player's own odds, so
# the deck holds what is likely to come up.
#
# During play, when something happens (a hit, a kill, a long walk, a rest, a
# close call) the server rolls, using entropy gathered from the player's own
# inputs. If fate strikes, it draws the matching card and applies it at once.
# The agent is never on the critical path; with no matching card (or no
# agent), a fallback card is used.

deck:
  # Cards requested per deal.
  size: 8
  # Ask for a new deal when fewer cards remain, or when the player's
  # situation changed (place, level, karma standing).
  refill_below: 3
  # Never deal to the same player more often than this.
  min_refill_s: 20

# Minimum time between two fate events for the same player.
cooldown_s: 25

# Moments when fate may strike, and the chance it does.
triggers:
  strike:   # the player lands a hit
    chance: 0.08
  kill:
    chance: 0.25
  travel:
    chance: 0.20
    every_m: 40
  rest:
    chance: 0.15
    after_s: 12
  wounded:
    chance: 0.35
    below_hp: 0.3

# P(fortune) = clamp(0.5 + luck_weight*(luck-10) + karma_weight*karma, min, max)
fortune_odds:
  luck_weight: 0.03
  karma_weight: 0.004
  min: 0.1
  max: 0.9

# Karma changes from deeds.
karma:
  kill_hostile_npc: 1
  min: -100
  max: 100

# Items treasure, spoils and hidden caches can grant, by magnitude.
loot:
  1: [spirit_herb, copper_coin_string]
  2: [jade_token, qi_gathering_pill, spirit_herb]
  3: [ancient_manual_fragment, phoenix_feather, qi_gathering_pill]

# The catalog of what Fate can do. Each action names its omen, the triggers
# it fits, and its numbers. "per_magnitude" values scale with the card's
# magnitude (1-3). The server implements each action kind; the agent only
# chooses among the ones allowed for a slot and narrates.
actions:
  # --- fortune ---
  treasure:      # an item from the loot table
    omen: fortune
    triggers: [kill, travel, rest]
  blessing:      # heal to full
    omen: fortune
    triggers: [wounded, rest, kill]
  insight:       # experience
    omen: fortune
    triggers: [rest, travel, kill]
    exp_per_magnitude: 25
  critical:      # this hit deals (1 + magnitude) times damage
    omen: fortune
    triggers: [strike]
  weakness:      # the enemy is exposed: takes more damage for a while
    omen: fortune
    triggers: [strike]
    duration_s: 20
    bonus_per_magnitude: 0.25
  vigor_aura:    # the player deals more damage for a while
    omen: fortune
    triggers: [rest, kill, travel]
    duration_s: 30
    bonus_per_magnitude: 0.15
  hidden_cache:  # a hidden cache appears nearby; reach it to claim an item
    omen: fortune
    triggers: [travel, rest]
    distance_m: [10, 18]
    expire_s: 120
  spoils:        # the foe just defeated drops an extra item
    omen: fortune
    triggers: [kill]

  # --- misfortune ---
  ambush:        # magnitude enemies appear around the player and attack
    omen: misfortune
    triggers: [travel, rest, kill]
    npc: ambusher
  mishap:        # lose part of max hp (never lethal)
    omen: misfortune
    triggers: [travel, rest]
    hp_loss_per_magnitude: 0.12
  fumble:        # this hit misses
    omen: misfortune
    triggers: [strike]
  enrage:        # the enemy becomes enraged: deals more damage for a while
    omen: misfortune
    triggers: [strike]
    duration_s: 20
    bonus_per_magnitude: 0.25
  ill_omen:      # the player deals less damage for a while
    omen: misfortune
    triggers: [travel, rest, kill, wounded]
    duration_s: 30
    bonus_per_magnitude: -0.12
