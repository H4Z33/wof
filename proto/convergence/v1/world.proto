syntax = "proto3";

package convergence.v1;

option go_package = "convergence/server/gen/convergence/v1;convergencev1";

// Bump when a change breaks older clients. The server rejects mismatches in Hello.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_CURRENT = 7;
}

enum FateOmen {
  FATE_OMEN_UNSPECIFIED = 0;
  FATE_OMEN_FORTUNE = 1;
  FATE_OMEN_MISFORTUNE = 2;
}

enum EntityKind {
  ENTITY_KIND_UNSPECIFIED = 0;
  ENTITY_KIND_PLAYER = 1;
  ENTITY_KIND_NPC = 2;
  // Things in the world, like a hidden cache revealed by Fate.
  ENTITY_KIND_OBJECT = 3;
}

// Bit flags in EntityState.effects.
enum EffectFlag {
  EFFECT_FLAG_UNSPECIFIED = 0;
  EFFECT_FLAG_VIGOR = 1;     // deals more damage
  EFFECT_FLAG_WEAKENED = 2;  // takes more damage
  EFFECT_FLAG_ENRAGED = 4;   // deals more damage (enemy)
  EFFECT_FLAG_ILL_OMEN = 8;  // deals less damage
  EFFECT_FLAG_WARD = 16;     // takes less damage
  EFFECT_FLAG_BURNING = 32;  // damage over time
  EFFECT_FLAG_STUNNED = 64;  // cannot act
  EFFECT_FLAG_SLOWED = 128;  // moves slower
  EFFECT_FLAG_REGEN = 256;   // heals over time
}

enum CombatEventKind {
  COMBAT_EVENT_KIND_UNSPECIFIED = 0;
  // amount = damage dealt.
  COMBAT_EVENT_KIND_DAMAGE = 1;
  // The target died from this hit.
  COMBAT_EVENT_KIND_DEATH = 2;
  // The attack missed (amount = 0).
  COMBAT_EVENT_KIND_MISS = 3;
  // amount = health restored.
  COMBAT_EVENT_KIND_HEAL = 4;
}

message Vec3 {
  float x = 1;
  float y = 2;
  float z = 3;
}

// ---------------------------------------------------------------------------
// Client -> Server. Every WebSocket binary frame from the client is one
// ClientMessage.
// ---------------------------------------------------------------------------

message ClientMessage {
  oneof payload {
    Hello hello = 10;
    MoveInput move = 11;
    Ping ping = 12;
    UseSkill use_skill = 13;
  }
}

// First message on a new connection. The ticket comes from POST /api/v1/play.
message Hello {
  string token = 1;
  uint32 protocol_version = 2;
}

// One fixed-length step of player input (one server tick). The client sends
// one per tick while the player is moving or turning, and predicts the result
// locally. The server applies them in order and acknowledges the last one
// in every Snapshot.
message MoveInput {
  uint32 seq = 1;
  // Desired direction on the ground plane. The server clamps the length to 1.
  float dir_x = 2;
  float dir_z = 3;
  // Facing in radians around the Y axis.
  float yaw = 4;
}

message Ping {
  uint64 client_time_ms = 1;
}

// Request to use a skill on a target. The server checks cooldown, range and
// that both sides are alive; failures come back as SkillRejected.
message UseSkill {
  uint32 skill_id = 1;
  uint32 target_id = 2;
}

// ---------------------------------------------------------------------------
// Server -> Client. Every WebSocket binary frame from the server is one
// ServerMessage.
// ---------------------------------------------------------------------------

message ServerMessage {
  oneof payload {
    Welcome welcome = 10;
    Snapshot snapshot = 11;
    Pong pong = 12;
    ServerError error = 13;
    SkillRejected skill_rejected = 14;
    FateEvent fate = 15;
  }
}

message Welcome {
  uint32 entity_id = 1;
  string zone_id = 2;
  uint32 tick_rate = 3;
  uint32 server_tick = 4;
  // Movement rules the client needs to predict exactly like the server.
  float move_speed = 5;
  Vec3 spawn = 6;
  // Walkable square is [-half_extent, half_extent] on X and Z.
  float half_extent = 7;
  repeated SkillInfo skills = 8;
  PlayerStatus status = 9;
  string character_name = 10;
  repeated InventoryItem inventory = 11;
  // Absent for a flat zone.
  TerrainInfo terrain = 12;
  ClassInfo class_info = 13;
}

message ClassInfo {
  string key = 1;
  string name = 2;
  // jade, brass or myth.
  string world = 3;
  string resource_name = 4;
  // "#rrggbb".
  string resource_color = 5;
}

// The heightmap and walking rules the client needs to predict movement
// exactly like the server.
message TerrainInfo {
  // File name under client/assets/terrain.
  string file = 1;
  // SHA-256 of the file; a mismatch means the client's copy is out of date.
  string sha256 = 2;
  // Steepest climb allowed, as rise over run.
  float max_slope = 3;
  float water_level = 4;
  float wade_depth = 5;
}

message InventoryItem {
  string key = 1;
  string name = 2;
  uint32 quantity = 3;
}

// What the client needs to show a skill and predict its cooldown.
message SkillInfo {
  uint32 id = 1;
  string name = 2;
  float range = 3;
  uint32 cooldown_ms = 4;
  // Animation the caster plays (UAL clip name).
  string anim = 5;
  // Draw a projectile from caster to target.
  bool projectile = 6;
  string description = 7;
  uint32 cost = 8;
  // Self skills need no target.
  bool target_self = 9;
  // Client effect key (client/game/vfx.gd).
  string vfx = 10;
  // Area radius around the target, if any.
  float radius = 11;
}

message PlayerStatus {
  uint32 level = 1;
  uint64 exp = 2;
  uint64 exp_to_next = 3;
  uint32 hp = 4;
  uint32 max_hp = 5;
  // While dead: time until respawn.
  uint32 respawn_in_ms = 6;
  uint32 luck = 7;
  sint32 karma = 8;
  uint32 resource = 9;
  uint32 resource_max = 10;
}

message EntityState {
  uint32 id = 1;
  Vec3 pos = 2;
  float yaw = 3;
  bool moving = 4;
  uint32 hp = 5;
  uint32 max_hp = 6;
  // EffectFlag bits.
  uint32 effects = 7;
}

message EntitySpawn {
  uint32 id = 1;
  string name = 2;
  // Character model key, resolved by the client (e.g. "mannequin_f").
  string model = 3;
  EntityState state = 4;
  EntityKind kind = 5;
  uint32 level = 6;
  // Players: their class key.
  string class_key = 7;
  // NPCs: how their attack looks (animation, effect, flies to the target).
  string attack_anim = 8;
  string attack_vfx = 9;
  bool attack_projectile = 10;
}

message CombatEvent {
  CombatEventKind kind = 1;
  uint32 source_id = 2;
  uint32 target_id = 3;
  uint32 skill_id = 4;
  uint32 amount = 5;
  bool critical = 6;
}

// Sent every tick. Spawns and despawns are relative to what this client
// already knows (its interest area), so each client gets its own Snapshot.
message Snapshot {
  uint32 tick = 1;
  // Last MoveInput.seq the server applied for this client's own entity.
  uint32 ack_input_seq = 2;
  repeated EntityState entities = 3;
  repeated EntitySpawn spawns = 4;
  repeated uint32 despawns = 5;
  // Combat this tick involving entities this client can see.
  repeated CombatEvent events = 6;
  PlayerStatus status = 7;
}

// Something Fate made happen to this player. The narration comes from the
// Fate agent (or a fallback line); the effect was already applied.
message FateEvent {
  FateOmen omen = 1;
  // 1 (minor) to 3 (major).
  uint32 magnitude = 2;
  // A fate action from content/fate.yaml, or cache_found.
  string action = 3;
  string narration = 4;
  // Items: the item found. insight: exp gained. mishap: hp lost.
  string item_name = 5;
  uint32 amount = 6;
  // Full inventory after the event, when it changed.
  repeated InventoryItem inventory = 7;
  // What set it off: strike, kill, travel, rest, wounded (or cache_found).
  string trigger = 8;
  // For effects that last: how long.
  uint32 duration_ms = 9;
}

message SkillRejected {
  uint32 skill_id = 1;
  // Machine-readable: cooldown, out_of_range, invalid_target, dead,
  // unknown_skill, not_enough_resource, stunned.
  string reason = 2;
}

message Pong {
  uint64 client_time_ms = 1;
  uint32 server_tick = 2;
}

message ServerError {
  string code = 1;
  string message = 2;
}
